name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *" # Runs daily at 18:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_contribution_graph.py'
      - '.github/workflows/profile-3d.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contrib-graph
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Custom 3D Contribution Graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
          OUTPUT_PATH: 'assets/contribution-3d.svg'
        run: |
          python3 scripts/generate_contribution_graph.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-3d.svg README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(contrib): update 3d contribution graph [skip ci]"
            git pull --rebase origin main
            git push
          fi

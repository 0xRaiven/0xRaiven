name: Update Profile Views

on:
  schedule:
    - cron: '*/30 * * * *' # Run every 30 minutes
  workflow_dispatch: # Allow manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-views:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Latest View Count & Update SVG
        run: python3 scripts/update_views.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/hero-card.svg README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(telemetry): update profile views count [skip ci]"
            git pull --rebase origin main
            git push
          fi
